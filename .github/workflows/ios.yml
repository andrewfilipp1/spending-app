name: ios
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
    tags: ["ios-v*"]
  workflow_dispatch:
permissions:
  contents: write # needed only to attach the .ipa to a release on ios-v* tags
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Core tests
        working-directory: ios/SpendingCore
        run: swift test
      - name: Generate project
        working-directory: ios
        run: brew install xcodegen && xcodegen
      - name: Build (unsigned, for device)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Oikonomika.xcodeproj -scheme Oikonomika -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log \
          || { grep -E '^/.*: error: ' build.log | sort -u | head -50 | sed -E 's#^([^:]+):([0-9]+):([0-9]+): error: (.*)#::error file=\1,line=\2,col=\3::\4#'; exit 1; }
      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Oikonomika.app Payload/
          zip -qry Oikonomika.ipa Payload
          ls -la Oikonomika.ipa
      - uses: actions/upload-artifact@v5
        with:
          name: Oikonomika-ipa
          path: ios/Oikonomika.ipa
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ios/Oikonomika.ipa --title "Οικονομικά iOS ${GITHUB_REF_NAME#ios-v}" --notes "Εγκατάσταση με SideStore/AltStore. Δες το ios/README.md." || gh release upload "${GITHUB_REF_NAME}" ios/Oikonomika.ipa --clobber

  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build for simulator
        working-directory: ios
        run: |
          brew install xcodegen && xcodegen
          set -o pipefail
          xcodebuild -project Oikonomika.xcodeproj -scheme Oikonomika -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5
      - name: Launch and take screenshots
        working-directory: ios
        run: |
          set -x
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone 16") or x["name"].startswith("iPhone 1")))')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/Oikonomika.app
          mkdir -p shots
          for tab in home nutrition history stats settings; do
            xcrun simctl terminate "$DEV" com.andrewfilipp.oikonomika || true
            xcrun simctl launch "$DEV" com.andrewfilipp.oikonomika -demo-data -tab $tab
            sleep 8
            # fails the job if the app crashed
            xcrun simctl spawn "$DEV" launchctl list | grep -q oikonomika
            xcrun simctl io "$DEV" screenshot "shots/$tab.png"
          done
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl terminate "$DEV" com.andrewfilipp.oikonomika || true
          xcrun simctl launch "$DEV" com.andrewfilipp.oikonomika -demo-data -tab home
          sleep 8
          xcrun simctl io "$DEV" screenshot "shots/home-dark.png"
      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ios/shots
