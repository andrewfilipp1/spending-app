<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <!-- Only files from this site may load; no inline scripts, no third parties, no network calls elsewhere. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Οικονομικά">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Ιδιωτική εφαρμογή για budget και έξοδα. Τα δεδομένα μένουν στη συσκευή σου.">
  <title>Τα Οικονομικά μου</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/version.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="lock" class="lock" hidden>
    <form id="lockForm" class="lock-card" autocomplete="off">
      <div class="lock-icon" aria-hidden="true">🔒</div>
      <h1>Τα Οικονομικά μου</h1>
      <p class="muted">Τα δεδομένα είναι κρυπτογραφημένα σε αυτή τη συσκευή.</p>
      <input id="lockInput" type="password" autocomplete="current-password" placeholder="Κωδικός" aria-label="Κωδικός">
      <p id="lockError" class="error" role="alert"></p>
      <button id="lockSubmit" class="btn primary full" type="submit">Ξεκλείδωμα</button>
      <button id="lockForgot" class="link" type="button">Ξέχασα τον κωδικό</button>
    </form>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <h1 id="title">Τα Οικονομικά μου</h1>
      <button id="lockTopBtn" class="icon-btn" type="button" aria-label="Κλείδωμα" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
    </header>

    <div id="updateBanner" class="update-banner" hidden role="status">
      <span>Υπάρχει νέα έκδοση της εφαρμογής.</span>
      <button id="updateBtn" class="btn primary small" type="button">Ενημέρωση</button>
    </div>

    <main id="view"></main>

    <nav class="tabbar" aria-label="Κύρια πλοήγηση">
      <button type="button" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Αρχική</span>
      </button>
      <button type="button" data-tab="history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        <span>Ιστορικό</span>
      </button>
      <button type="button" id="addBtn" class="add-btn" aria-label="Νέα αγορά">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" data-tab="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span>Στατιστικά</span>
      </button>
      <button type="button" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
        <span>Ρυθμίσεις</span>
      </button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Η εφαρμογή χρειάζεται JavaScript.</noscript>
</body>
</html>
