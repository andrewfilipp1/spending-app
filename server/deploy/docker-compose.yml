# Sync server + Caddy (HTTPS) in their own containers. Only port 443 is published.
#   cd deploy && echo SYNC_DOMAIN=sync.example.com > .env && docker compose up -d --build
name: spending-sync

services:
  sync:
    build: ..
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: https://andrewfilipp1.github.io
    volumes:
      - sync-data:/data
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    logging:
      options: { max-size: "5m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN:?set SYNC_DOMAIN in .env}
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal, public]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging:
      options: { max-size: "5m", max-file: "3" }

networks:
  internal:
    internal: true # no internet access for the sync server
  public: {}

volumes:
  sync-data:
  caddy-data:
  caddy-config:
