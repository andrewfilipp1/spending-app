# Optional: photo calorie estimates (POST /v1/estimate). Gives the sync server outgoing internet
# access, which it otherwise does not have, so it can reach api.anthropic.com.
#   echo ANTHROPIC_API_KEY=sk-ant-... >> .env && chmod 600 .env
#   docker compose -f docker-compose.yml -f docker-compose.estimate.yml up -d --build
services:
  sync:
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      ESTIMATES_PER_DAY: ${ESTIMATES_PER_DAY:-40}
    networks: [internal, egress]

networks:
  egress: {}
