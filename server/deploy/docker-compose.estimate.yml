# Optional: photo calorie estimates (POST /v1/estimate). Gives the sync server outgoing internet
# access, which it otherwise does not have, so it can reach the AI service.
#   In .env (chmod 600): ESTIMATE_PROVIDER=claude + ANTHROPIC_API_KEY=sk-ant-...
#                    or: ESTIMATE_PROVIDER=gemini + GEMINI_API_KEY=...
#   docker compose -f docker-compose.yml -f docker-compose.estimate.yml up -d --build
services:
  sync:
    environment:
      ESTIMATE_PROVIDER: ${ESTIMATE_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ESTIMATE_MODEL: ${ESTIMATE_MODEL:-}
      ESTIMATES_PER_DAY: ${ESTIMATES_PER_DAY:-40}
    networks: [internal, egress]

networks:
  egress: {}
